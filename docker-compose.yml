services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    env_file:
      - ./db.env          # contains MSSQL_SA_PASSWORD — create from db.env.example
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$MSSQL_SA_PASSWORD -Q 'SELECT 1' -No"]
      interval: 10s
      retries: 10
      start_period: 30s

  api:
    build: ./backend
    ports:
      - "5000:8080"
    environment:
      DB_HOST: db
      DB_NAME: CrudVaultDb
      DB_USER: sa
      DB_PASS: ${DB_PASS}
      ASPNETCORE_ENVIRONMENT: Production
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  sqldata:
